<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 - 펜션 예약 관리</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>관리자 페이지</h1>
    <div class="header-actions">
      <a href="/" class="header-link">달력으로</a>
      <button id="logoutBtn" class="header-link-btn">로그아웃</button>
    </div>
  </header>

  <div class="admin-section">
    <h2>회원(관리자 계정) 관리</h2>
    <table class="reservation-table" id="adminTable">
      <thead>
        <tr>
          <th>아이디</th>
          <th>등급</th>
          <th>생성일</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="adminTableBody"></tbody>
    </table>

    <form id="addAdminForm" class="admin-add-form">
      <h3>계정 추가</h3>
      <div class="row">
        <label>아이디
          <input type="text" id="newUsername" required>
        </label>
        <label>비밀번호
          <input type="password" id="newPassword" required>
        </label>
      </div>
      <label>등급
        <select id="newRole">
          <option value="system">시스템 관리자 (모든 메뉴 사용 가능)</option>
          <option value="reservation" selected>예약 관리자 (관리자 메뉴 제외 전체 예약 관리)</option>
          <option value="facility">시설 관리자 (예약 조회만 가능, 수정 불가)</option>
        </select>
      </label>
      <div id="addAdminError" class="login-error hidden"></div>
      <button type="submit" class="primary">추가</button>
    </form>
  </div>

  <div class="admin-section">
    <h2>데이터 백업/복원</h2>
    <div class="backup-restore-box">
      <p class="admin-note">예약 및 요금 데이터를 백업 파일(.json)로 내려받아 보관하거나, 이전에 내려받은 백업 파일로 되돌릴 수 있습니다.</p>
      <div class="backup-restore-row">
        <button id="backupBtn" type="button" class="primary">백업 다운로드</button>
      </div>
      <div class="backup-restore-row">
        <input type="file" id="restoreFileInput" accept="application/json">
        <button id="restoreBtn" type="button" class="danger">이 파일로 복원</button>
      </div>
      <p class="admin-note">⚠️ 복원하면 현재의 모든 예약/요금 데이터가 사라지고, 선택한 백업 파일의 내용으로 완전히 대체됩니다. 되돌릴 수 없으니 신중하게 진행해주세요.</p>
      <div id="backupRestoreMsg"></div>
    </div>
  </div>

  <div id="passwordModalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h3>비밀번호 변경</h3>
      <form id="passwordForm">
        <input type="hidden" id="passwordTargetId">
        <label>새 비밀번호
          <input type="password" id="newPasswordInput" required>
        </label>
        <div id="passwordError" class="login-error hidden"></div>
        <div class="modal-actions">
          <button type="submit" class="primary">변경</button>
          <button type="button" id="closePasswordModal">취소</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
