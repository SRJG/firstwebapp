<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>펜션 예약 관리</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>펜션 예약 관리</h1>
    <div class="tabs" id="tabs"></div>
  </header>

  <div class="calendar-header">
    <button id="prevMonth">&lt;</button>
    <h2 id="monthLabel"></h2>
    <button id="nextMonth">&gt;</button>
    <button id="viewToggleBtn" class="primary">예약 보기</button>
    <button id="priceModeBtn">요금 입력</button>
  </div>

  <div id="priceModePanel" class="price-mode-panel hidden">
    <span id="priceModeInfo">0일 선택됨</span>
    <input type="text" id="priceModeInput" inputmode="numeric" placeholder="1박 요금">
    <button id="priceModeApply" class="primary">적용</button>
    <button id="priceModeCancel">취소</button>
  </div>

  <div id="calendarView">
    <div class="weekday-row">
      <div class="weekday sun">일</div>
      <div class="weekday">월</div>
      <div class="weekday">화</div>
      <div class="weekday">수</div>
      <div class="weekday">목</div>
      <div class="weekday">금</div>
      <div class="weekday sat">토</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <div id="listView" class="hidden">
    <table class="reservation-table">
      <thead>
        <tr>
          <th>예약자</th>
          <th>기간</th>
          <th>연락처</th>
          <th>인원</th>
          <th>총 요금</th>
          <th>남은 금액</th>
        </tr>
      </thead>
      <tbody id="listViewBody"></tbody>
    </table>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="modalTitle">예약 정보</h3>
      <form id="reservationForm">
        <input type="hidden" id="resId">

        <label>예약자 이름
          <input type="text" id="guestName" required>
        </label>

        <label>연락처
          <input type="text" id="phone" placeholder="010-0000-0000">
        </label>

        <div class="date-picker-section">
          <label>숙박 기간</label>
          <div class="date-range-display" id="dateRangeDisplay">체크인 날짜를 선택하세요</div>
          <div class="mini-calendar">
            <div class="mini-calendar-header">
              <button type="button" id="pickerPrevMonth">&lt;</button>
              <span id="pickerMonthLabel"></span>
              <button type="button" id="pickerNextMonth">&gt;</button>
            </div>
            <div class="mini-calendar-grid" id="pickerGrid"></div>
          </div>
          <input type="hidden" id="checkIn" required>
          <input type="hidden" id="checkOut" required>
        </div>

        <label>인원
          <input type="number" id="numGuests" min="1">
        </label>

        <div class="row">
          <label>총 요금
            <input type="text" id="totalPrice" inputmode="numeric" placeholder="0">
          </label>
          <label>받은 금액
            <input type="text" id="paidAmount" inputmode="numeric" placeholder="0">
          </label>
        </div>

        <div class="remaining">남은 금액: <span id="remainingAmount">0</span>원</div>

        <label class="checkbox-label">
          <input type="checkbox" id="bbqRequested"> 바베큐 요청
        </label>

        <label>메모
          <textarea id="memo" rows="3"></textarea>
        </label>

        <div class="modal-actions">
          <button type="submit" class="primary">저장</button>
          <button type="button" id="deleteBtn" class="danger hidden">삭제</button>
          <button type="button" id="closeModal">닫기</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
